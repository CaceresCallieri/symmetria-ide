# Local-hook pre-commit config — every hook calls a tool already installed on
# the developer's machine (see docs/dev-workflow.md for the `paru -S` list).
# We avoid pulling pinned versions from GitHub so local + CI use the exact
# same tool binaries; drift surfaces the moment CI disagrees with a hook.
#
# Installation:
#   pre-commit install
#
# One-off full run against all tracked files:
#   pre-commit run --all-files

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: ruff check
        types_or: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff format --check
        types_or: [python]
        pass_filenames: true

      - id: selene
        name: selene (Lua)
        language: system
        entry: selene --config selene.toml
        types_or: [lua]
        pass_filenames: true

      - id: stylua-check
        name: stylua (check-only)
        language: system
        entry: stylua --check
        types_or: [lua]
        pass_filenames: true

      # QML lint, via a ratchet rather than the binary directly. Calling
      # `qmllint` here is what we did before and it cannot fail a commit: it
      # exits 0 on warnings, so it printed findings and passed — which is how
      # a real `unqualified` violation reached `BrowserPane.qml`. Failing on
      # any finding is equally unusable (~1500 exist, most of them context
      # properties qmllint cannot resolve by construction), so the gate allows
      # each file the findings `scripts/qmllint-baseline.json` records for it
      # and fails on an increase. The script's docstring carries the reasoning
      # and the one guarantee it does NOT give.
      #
      # It picks the Qt6 binary itself — the bare `qmllint` on PATH is Qt5's
      # on Arch and chokes on Qt6 syntax such as aliased imports.
      - id: qmllint
        name: qmllint (QML — no new findings)
        language: system
        entry: python3 scripts/qmllint_gate.py
        files: \.qml$
        pass_filenames: true

      # pyright runs in REPORT-ONLY mode for now — the project baseline is
      # ~39 errors (known PySide6-stubs false positives, gotcha #7).
      # Blocking commits here would be noisy until the baseline is clean.
      # Remove `verbose: true` once the baseline error count drops to zero.
      - id: pyright
        name: pyright (type check — report only)
        language: system
        entry: bash -c 'pyright || true'
        pass_filenames: false
        always_run: true
        verbose: true
