[project]
name = "symmetria-ide"
version = "0.0.1"
description = "A custom IDE wrapper built on NeoVim, in the Symmetria ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Juan Caceres Callieri", email = "cacerescallieri@gmail.com" },
]

dependencies = [
    "PySide6>=6.7",
    "pynvim>=0.5",
    # msgpack is pynvim's RPC wire codec — we don't import it directly, but pin
    # it so the msgpack-RPC transport version is reproducible.
    "msgpack>=1.0",
]
# NOTE: the terminal/editor panes require our FORK of qmltermwidget, a system
# Qt6 QML module (a C++ .so), NOT a pip package — so it cannot live in
# `dependencies`. Build it from /home/jc/projects/symmetria-qmltermwidget
# (`qmake6 && make`); the IDE adds it to the QML import path. See CLAUDE.md
# "The terminal panes" + that repo's MODIFICATIONS.md. (`pyte` was removed
# here when the pyte-based terminal stack was deleted in the migration.)

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional runtime deps for the agent/browser MCP server (browser_mcp.py).
# Kept OUT of core `dependencies` — the feature degrades gracefully when
# absent (browser_mcp.py guards its mcp/uvicorn imports). CI installs this
# extra so the dual-transport regression guard in test_browser_mcp.py runs
# instead of erroring on a missing `mcp`. `mcp` pulls starlette + uvicorn +
# sse-starlette transitively.
browser = ["mcp>=1.28"]

[project.scripts]
symmetria-ide = "symmetria_ide.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# NB: the IDE currently runs from source (the launcher injects PYTHONPATH=src),
# so these globs are hygiene for a future real install rather than load-bearing
# today. They mirror what's actually under qml/ and runtime/ post-migration:
# the design-token singleton (qml/design/) and the full Lua orchestrator tree
# (runtime/lua/**). The old runtime/symmetria-shell/ OSC 7 scripts were deleted
# in the qmltermwidget migration.
[tool.setuptools.package-data]
symmetria_ide = [
    "qml/*.qml",
    "qml/design/*",
    "runtime/*.lua",
    "runtime/**/*.lua",
]

[tool.ruff]
# ⚠ This section is load-bearing for the pre-commit hook, and its ABSENCE was a
# real defect: with no config, the enforced rule set is whatever the installed
# ruff happens to default to. Measured on ruff 0.16.0 (Arch, 2026-08-04): 415
# rules — not the ~30 of the documented default. That made `ruff check` fail on
# 152 pre-existing findings across 55 files, so the hook failed on most commits
# and the only way through was `--no-verify`, which is a hook that protects
# nothing. It also meant a ruff upgrade could change the rule set underfoot.
#
# 88, not the 100 that `.claude/project-standards.md` used to state: the tree is
# already formatted at 88 everywhere, and 100 would reflow 77 files for no
# functional gain. Flip both together if that is ever wanted deliberately.
line-length = 88

[tool.ruff.lint]
# The set the project standards describe: pyflakes, pycodestyle, isort,
# pyupgrade, bugbear. Deliberately NOT `RUF` — RUF100 (unused-noqa) would flag
# every `# noqa: ARG002` / `# noqa: BLE001` in the tree, since those name rules
# this selection does not enable. Enable ARG/BLE first if RUF is ever wanted.
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length. E501 only ever fires on what the formatter
# CANNOT split — long comments, URLs, string literals — so it is noise here
# rather than a second opinion. (Ruff's own docs recommend this pairing.)
ignore = ["E501"]

[tool.pyright]
# Same defect the ruff section above records, in a second tool: with no config
# committed, `pyright` reported 608 errors and the pre-commit hook printed all
# of them on every commit. Two thirds of that was noise of two specific kinds.
#
# 1. `native/` is EXCLUDED because makepkg stages the whole repo under
#    `native/symmetria-compositor/src/`, so pyright was type-checking a second
#    copy of every file — that alone was 304 of the 608.
# 2. `tests/` is not included at all. The suite deliberately passes duck-typed
#    doubles (`FakeEvent`, recording pools, stub controllers) where a real type
#    is declared; that is the test style, not a defect to report on 189 times.
#
# `basic` rather than the CLI's default `standard`: basic already suppresses the
# `QAbstractItemModel.data/rowCount/roleNames` override complaints that gotcha #7
# says NOT to "fix" (reshaping those signatures breaks Qt's metaobject system).
# An explicit `reportIncompatibleMethodOverride = false` was measured to change
# nothing on top of it, so it is deliberately absent rather than decorative.
#
# What remains is ~85, of which ~69 are in app.py and most are PySide6's own
# untyped idioms — `@Property("QVariantList", ...)` reads as a `Property`
# descriptor rather than the value it returns. The hook stays REPORT-ONLY for
# that reason; the honest count lives in `.pre-commit-config.yaml`, and a
# qmllint-style ratchet is the obvious next step if this is ever to block.
include = ["src", "scripts", "tools", "bench", "runtime"]
exclude = ["**/__pycache__", "native", "sidecar", ".claude"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
