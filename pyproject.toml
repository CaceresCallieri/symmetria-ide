[project]
name = "symmetria-ide"
version = "0.0.1"
description = "A custom IDE wrapper built on NeoVim, in the Symmetria ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Juan Caceres Callieri", email = "cacerescallieri@gmail.com" },
]

dependencies = [
    "PySide6>=6.7",
    "pynvim>=0.5",
    "msgpack>=1.0",
    "pyte>=0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# pyte is here for the Phase 2.5 native PTY terminal pane
# (`src/symmetria_ide/terminal_backend.py` — pyte's HistoryScreen +
# ByteStream drive the cell-grid that TerminalView paints). Phase 2
# originally planned a pty + pyte bridge for the AGENT pane, but that
# pivoted to `claude -p` and later to the Node SDK sidecar — neither
# uses pyte. Phase 2.5 reintroduces pyte for the surface where it
# always belonged (the terminal). See `docs/phases.md` Phase 2.5 and
# `.claude/memory/project/active/phase25_current_state.md`.

[project.scripts]
symmetria-ide = "symmetria_ide.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symmetria_ide = [
    "qml/*.qml",
    "runtime/*.lua",
    # Phase 2.5 deliverable 3 — shell-init scripts for OSC 7 cwd
    # auto-injection. `.zshenv` / `.zshrc` are dotfiles, so the glob
    # must use `.*` to include them; the bash init is a regular file.
    "runtime/symmetria-shell/zsh/.*",
    "runtime/symmetria-shell/bash/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
