[project]
name = "symmetria-ide"
version = "0.0.1"
description = "A custom IDE wrapper built on NeoVim, in the Symmetria ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Juan Caceres Callieri", email = "cacerescallieri@gmail.com" },
]

dependencies = [
    "PySide6>=6.7",
    "pynvim>=0.5",
    # msgpack is pynvim's RPC wire codec — we don't import it directly, but pin
    # it so the msgpack-RPC transport version is reproducible.
    "msgpack>=1.0",
]
# NOTE: the terminal/editor panes require our FORK of qmltermwidget, a system
# Qt6 QML module (a C++ .so), NOT a pip package — so it cannot live in
# `dependencies`. Build it from /home/jc/projects/symmetria-qmltermwidget
# (`qmake6 && make`); the IDE adds it to the QML import path. See CLAUDE.md
# "The terminal panes" + that repo's MODIFICATIONS.md. (`pyte` was removed
# here when the pyte-based terminal stack was deleted in the migration.)

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
symmetria-ide = "symmetria_ide.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# NB: the IDE currently runs from source (the launcher injects PYTHONPATH=src),
# so these globs are hygiene for a future real install rather than load-bearing
# today. They mirror what's actually under qml/ and runtime/ post-migration:
# the design-token singleton (qml/design/) and the full Lua orchestrator tree
# (runtime/lua/**). The old runtime/symmetria-shell/ OSC 7 scripts were deleted
# in the qmltermwidget migration.
[tool.setuptools.package-data]
symmetria_ide = [
    "qml/*.qml",
    "qml/design/*",
    "runtime/*.lua",
    "runtime/**/*.lua",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
