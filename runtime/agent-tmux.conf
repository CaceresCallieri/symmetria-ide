# Symmetria IDE / Vigilia — shared tmux server config for agent sessions.
#
# Sourced once, when the agent tmux server first starts (passed via `tmux -f`).
# BOTH the IDE (which spawns agents into this server) and Vigilia's ttyd (which
# renders them for the phone) attach the SAME server, so these settings govern
# every agent pane on both surfaces. Keep this file byte-identical with any copy
# Vigilia ships for its ttyd invocation, or the two surfaces would diverge.

# No tmux status bar — the IDE and the phone render agent chrome themselves; the
# green tmux bar is just noise on both. (User requirement.)
set -g status off

# The IDE pane AND the phone can attach the SAME session simultaneously. Default
# tmux sizes a shared window to the SMALLEST attached client — which would shrink
# the desktop pane the moment the phone joins. `latest` sizes to the most
# recently active client instead; aggressive-resize lets each client use its own
# full size when it is the sole viewer of its window.
set -g window-size latest
setw -g aggressive-resize on

# Sessions MUST outlive having zero viewers — that persistence is the whole point
# (survive an IDE restart or a detach, stay reachable from the phone).
set -g destroy-unattached off

# Snappier nvim-inside-agent (no <Esc> disambiguation delay), generous scrollback,
# and phone scroll.
set -g escape-time 10
set -g history-limit 50000
set -g mouse on
