# Symmetria IDE / Vigilia — shared tmux server config for agent sessions.
#
# Sourced once, when the agent tmux server first starts (passed via `tmux -f`).
# BOTH the IDE (which spawns agents into this server) and Vigilia's ttyd (which
# renders them for the phone) attach the SAME server, so these settings govern
# every agent pane on both surfaces. Keep this file byte-identical with any copy
# Vigilia ships for its ttyd invocation, or the two surfaces would diverge.

# No tmux status bar — the IDE and the phone render agent chrome themselves; the
# green tmux bar is just noise on both. (User requirement.)
set -g status off

# The IDE pane AND the phone can attach the SAME session simultaneously. Default
# tmux sizes a shared window to the SMALLEST attached client — which would shrink
# the desktop pane the moment the phone joins. `latest` sizes to the most
# recently active client instead; aggressive-resize lets each client use its own
# full size when it is the sole viewer of its window.
set -g window-size latest
setw -g aggressive-resize on

# Sessions MUST outlive having zero viewers — that persistence is the whole point
# (survive an IDE restart or a detach, stay reachable from the phone).
set -g destroy-unattached off

# Snappier nvim-inside-agent (no <Esc> disambiguation delay), generous scrollback,
# and phone scroll.
set -g escape-time 10
set -g history-limit 50000
set -g mouse on

# Scrub ambient Claude-session / IDE env from every process this server spawns.
# The server inherits the environment of WHOEVER first touches the socket — in
# practice often a Claude Code agent (an IDE launched from an agent, a script
# run by one). Without these removal marks, every session on the socket inherits
# that agent's session identity: CLAUDE_JOB_DIR made fresh agents adopt a
# foreign job and take its session TITLE (the "mesura.consulting" incident,
# 2026-07-13, poisoning resume pickers across projects); CLAUDE_CODE_SESSION_ID/
# _CHILD_SESSION suppress transcript persistence; CLAUDE_EFFORT pins a leaked
# effort level. `set-environment -gr` marks the var for removal from new
# processes' environments — the per-spawn `env SYMMETRIA_AGENT_ID=… claude`
# wrapper still sets what each agent needs AFTER tmux builds the base env, so
# these marks never strip deliberately-injected values. Belt-and-braces with
# agent_harness.CLAUDE_ENV_UNSET_ARGS (which protects agent spawns even when
# this conf is missing); this scrub also covers plain shells in shared sessions.
set-environment -gr CLAUDE_CODE_CHILD_SESSION
set-environment -gr CLAUDE_CODE_SESSION_ID
set-environment -gr CLAUDE_JOB_DIR
set-environment -gr CLAUDE_EFFORT
set-environment -gr CLAUDECODE
set-environment -gr CLAUDE_CODE_ENTRYPOINT
set-environment -gr CLAUDE_CODE_EXECPATH
set-environment -gr SYMMETRIA_AGENT_ID
set-environment -gr SYMMETRIA_IDE_AGENT_SOCK
set-environment -gr SYMMETRIA_HOST_WINDOW_PID
set-environment -gr SYMMETRIA_IDE_STATUSLINE_TAP
set-environment -gr SYMMETRIA_IDE_APP_ID
set-environment -gr SYMMETRIA_IDE_QMLTERMWIDGET_PATH
