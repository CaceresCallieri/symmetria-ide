# CI pipeline — enforces every quality gate listed in standards §10 and
# documented in docs/dev-workflow.md. Same tools as the local
# pre-commit hooks (.pre-commit-config.yaml), same flags, same file set.
# Drift between local and CI surfaces the moment CI disagrees with a hook.
#
# Pyright runs report-only (matches the local hook) — ~59 known PySide6
# stubs false positives (CLAUDE.md gotcha #7) would otherwise wedge CI.
# Flip to blocking once the baseline drops to zero.
#
# Runs on ubuntu-latest rather than an Arch container because:
# 1. Arch containers have no AUR access (selene, stylua historically
#    required AUR) and `pacman -Syu` on every run is slow + mirror-flaky.
# 2. All tools we need are available as pip packages or dedicated
#    GitHub Actions, so the Ubuntu path is shorter and more reliable.
# 3. The tests run headless via Qt's `offscreen` platform plugin — no
#    distro-specific dependencies on Xorg, Wayland, or graphics stack.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt offscreen platform plugin pulls these in even though we never
      # open a display. Missing any of them surfaces as a cryptic
      # `qt.qpa.plugin: Could not load the Qt platform plugin "offscreen"`
      # during pytest.
      - name: Install system libraries for Qt offscreen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps + dev extras from pyproject.toml. The `browser` extra
          # pulls `mcp` (+ starlette/uvicorn) so the browser-MCP tests run
          # instead of erroring on a missing optional dep.
          pip install -e ".[dev,browser]"
          # Tooling matches what the maintainer runs locally via paru/pip.
          # Lower bounds only — a CI tool bump surfaces drift the same
          # day it happens.
          pip install "ruff>=0.6" "pyright>=1.1.400" "pip-audit>=2.7"

      - name: stylua — format check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check runtime/

      # selene has no maintained GitHub Action — the only one
      # (NTBBloodbath/selene-action) is pinned to a deprecated Node runtime
      # and unmaintained. Install the pinned prebuilt binary directly instead:
      # a plain run-step with no Node action, same selene version as before.
      - name: selene — Lua lint
        env:
          SELENE_VERSION: "0.27.1"
        run: |
          curl -fsSL -o /tmp/selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -o /tmp/selene.zip -d /tmp/selene-bin
          chmod +x /tmp/selene-bin/selene
          /tmp/selene-bin/selene --config selene.toml runtime/

      - name: Ruff — lint
        run: ruff check src/ tests/

      - name: Ruff — format check
        run: ruff format --check src/ tests/

      # Report-only. See header comment for rationale.
      - name: Pyright — type check (report only)
        run: pyright || true

      # `pyside6-qmllint` is the PySide6 wrapper around Qt's `qmllint`
      # and becomes available on PATH once `pip install -e ".[dev]"`
      # pulls PySide6. Prefer it over the bare `qmllint` so
      # Python-registered QML types (Symmetria.Ide) are resolvable.
      #
      # ADVISORY HERE, ENFORCED LOCALLY. `qmllint` exits 0 on warnings, so this
      # step reports and never fails; the enforcing gate is the pre-commit hook
      # (`scripts/qmllint_gate.py`), which ratchets each file against a
      # recorded baseline. That gate deliberately does NOT run here: its
      # baseline is generated by one Qt build, and the finding set shifts
      # between Qt versions, so a runner on a different PySide6 than the
      # developer's Arch Qt would fail on version skew rather than on code.
      # Moving CI onto it means pinning both sides to the same Qt first.
      #
      # `git ls-files` rather than `qml/*.qml`: the glob is not recursive and
      # silently skipped every file in `qml/browser/` and `qml/githistory/`.
      - name: qmllint — QML lint (advisory)
        run: git ls-files '*.qml' | xargs pyside6-qmllint

      # Dependency CVE scan. Scans the already-installed environment;
      # once a lockfile lands (#23), swap this to scan the lockfile for
      # precise CVE matching rather than range-based approximation.
      # NOTE: bare `pip-audit` (no `--disable-pip`). pip-audit >=2.8 rejects
      # `--disable-pip` unless `-r <requirements>` is also given; since this
      # audits the installed environment (no `-r`), the flag is invalid and
      # was failing CI. Bare invocation audits the same environment.
      - name: pip-audit — dependency CVE scan
        run: pip-audit

      # Offscreen Qt platform plugin keeps tests headless — no xvfb,
      # no Wayland (see docs/dev-workflow.md).
      # `python -m pytest` (NOT bare `pytest`): the module form puts the repo
      # root on sys.path, which several test modules need for their
      # `from tests.conftest import ...` helper imports. Bare `pytest` omits
      # it and fails collection with `ModuleNotFoundError: No module named
      # 'tests'`. This matches the documented command in CLAUDE.md.
      - name: pytest — offscreen unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v
